<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mh-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="mh-arrow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="mh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Glow -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#mh-bg-grad)" filter="url(#mh-glow)" />

  <!-- Inner Subtle Border Highlight -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="29.5" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

  <!-- Stylized Geometric "M" + Integrated Downward Velocity Arrow -->
  <g transform="translate(24, 26)">
    <!-- Left Pillar -->
    <rect x="4" y="8" width="12" height="48" rx="6" fill="#ffffff" />
    
    <!-- Right Pillar -->
    <rect x="64" y="8" width="12" height="48" rx="6" fill="#ffffff" />

    <!-- Center Dynamic Arrow / Hub Point -->
    <path d="M 12 16 L 40 46 L 68 16" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Downward Acceleration Arrow Tip -->
    <path d="M 28 54 L 40 66 L 52 54" fill="none" stroke="url(#mh-arrow-grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
